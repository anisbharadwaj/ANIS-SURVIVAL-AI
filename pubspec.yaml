name: anis_survival_ai
description: "Navigate. Survive. Anywhere. - Offline AI-powered survival navigation platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # GPS & Location Services
  geolocator: ^10.0.0
  location: ^5.0.0
  
  # Maps & Navigation
  flutter_map: ^6.0.0
  map_launcher: ^2.3.0
  
  # Offline Maps & Tiles
  flutter_cache_manager: ^3.3.1
  
  # AI & ML
  tflite_flutter: ^0.10.0
  google_ml_kit: ^0.13.0
  
  # Speech Recognition & TTS
  speech_to_text: ^6.4.0
  flutter_tts: ^8.1.0
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # UI & Animations
  flutter_animate: ^4.2.0
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Sensors
  sensors_plus: ^4.1.0
  
  # Device Info
  device_info_plus: ^10.1.0
  battery_plus: ^4.1.0
  
  # Connectivity
  connectivity_plus: ^5.1.0
  
  # Crypto & Security
  encrypt: ^4.0.0
  
  # Localization
  intl: ^0.19.0
  
  # Utilities
  uuid: ^4.0.0
  dio: ^5.3.0
  json_serializable: ^6.7.0
  freezed_annotation: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
    - assets/models/
    - assets/offline_data/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
